[project]
name = "farol-api"
version = "0.1.0"
description = "FAROL v2 — motor de atendimento em laco (SECOEAD/EMERON)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "openai>=1.60",
    "anthropic>=0.40",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.setuptools]
packages = ["app", "app.llm", "app.services", "app.api", "app.channels", "app.gatilhos"]

[tool.setuptools.package-data]
"app.gatilhos" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint.per-file-ignores]
# Conteudo dos documentos e prosa longa: concatenacao implicita e a forma legivel.
"app/seed/documentos.py" = ["ISC004"]
# Depends() em argumento padrao e o idioma do FastAPI.
"app/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
