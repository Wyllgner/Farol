services:
  db:
    image: pgvector/pgvector:pg16
    container_name: farol-db
    environment:
      POSTGRES_USER: farol
      POSTGRES_PASSWORD: farol
      POSTGRES_DB: farol
    ports:
      - "5434:5432"
    volumes:
      - farol-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farol -d farol"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  farol-pgdata:
